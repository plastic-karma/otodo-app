name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      export_ui_snapshots:
        description: Export UI test screenshot attachments
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  swift-package-tests:
    name: Swift package tests
    runs-on: ubuntu-24.04
    container: swift:6.1
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Run all core tests
        run: swift test

  ios-simulator:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PROJECT: OTodo.xcodeproj
      SCHEME: OTodo
      GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          newest="$(python3 <<'PY'
          import glob
          import plistlib

          xcodes = []
          for app in glob.glob("/Applications/Xcode*.app"):
              try:
                  with open(f"{app}/Contents/Info.plist", "rb") as info:
                      value = plistlib.load(info)["CFBundleShortVersionString"]
                  version = tuple(int(part) for part in value.split("."))
              except (KeyError, OSError, TypeError, ValueError):
                  continue
              xcodes.append((version, app))

          print(max(xcodes)[1] if xcodes else "")
          PY
          )"
          if [ -z "$newest" ]; then
            echo "::error::No Xcode installation was found on the runner."
            exit 1
          fi
          sudo xcode-select --switch "$newest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen 2.46.0
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_dir="$RUNNER_TEMP/xcodegen-tool"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/xcodegen/bin/xcodegen"
          echo "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Validate App Store bundle metadata
        run: |
          set -euo pipefail
          python3 <<'PY'
          import plistlib

          with open("OTodoApp/Info.plist", "rb") as source:
              info = plistlib.load(source)

          expected_version_settings = {
              "CFBundleShortVersionString": "$(MARKETING_VERSION)",
              "CFBundleVersion": "$(CURRENT_PROJECT_VERSION)",
          }
          for key, expected in expected_version_settings.items():
              if info.get(key) != expected:
                  raise SystemExit(f"{key} must use the {expected} build setting")

          expected_orientations = {
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationPortraitUpsideDown",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          }
          for key in (
              "UISupportedInterfaceOrientations",
              "UISupportedInterfaceOrientations~ipad",
          ):
              actual = info.get(key)
              if not isinstance(actual, list) or set(actual) != expected_orientations:
                  raise SystemExit(f"{key} must contain all four interface orientations")

          if not isinstance(info.get("UILaunchScreen"), dict):
              raise SystemExit("UILaunchScreen must be a dictionary")

          with open("OTodoWidget/Info.plist", "rb") as source:
              widget_info = plistlib.load(source)

          expected_widget_metadata = {
              "CFBundleDisplayName": "OTodo",
              "CFBundleShortVersionString": "$(MARKETING_VERSION)",
              "CFBundleVersion": "$(CURRENT_PROJECT_VERSION)",
          }
          for key, expected in expected_widget_metadata.items():
              if widget_info.get(key) != expected:
                  raise SystemExit(f"Widget {key} must be {expected}")

          extension = widget_info.get("NSExtension")
          if not isinstance(extension, dict) or extension.get("NSExtensionPointIdentifier") != "com.apple.widgetkit-extension":
              raise SystemExit("Widget NSExtensionPointIdentifier must be com.apple.widgetkit-extension")

          expected_groups = ["group.plastickarma.otodo"]
          for entitlements_path in (
              "OTodoApp/OTodo.entitlements",
              "OTodoWidget/OTodoWidget.entitlements",
          ):
              with open(entitlements_path, "rb") as source:
                  entitlements = plistlib.load(source)
              if entitlements.get("com.apple.security.application-groups") != expected_groups:
                  raise SystemExit(
                      f"{entitlements_path} must contain only the shared OTodo App Group"
                  )
          PY

      - name: Select available iPhone simulator
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json
          import re
          import sys

          runtimes = json.load(sys.stdin)["devices"]

          def version(identifier):
              return tuple(int(part) for part in re.findall(r"\d+", identifier))

          for runtime in sorted(runtimes, key=version, reverse=True):
              for device in runtimes[runtime]:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator is installed")
          ')"
          echo "Selected iPhone simulator UUID: $simulator_id"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xcode-results"
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/xcode-results/build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            GITHUB_CLIENT_ID="$GH_OAUTH_CLIENT_ID"

      - name: Run UI tests without rebuilding
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/xcode-results/test.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            GITHUB_CLIENT_ID="$GH_OAUTH_CLIENT_ID"

      - name: Export UI snapshots
        if: ${{ success() && inputs.export_ui_snapshots }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/ui-snapshots"
          mkdir -p "$output"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/xcode-results/test.xcresult" \
            --output-path "$output"

      - name: Upload UI snapshots
        if: ${{ success() && inputs.export_ui_snapshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-snapshots
          path: ${{ runner.temp }}/ui-snapshots
          if-no-files-found: error
          retention-days: 7

      - name: Retain failed Xcode result bundles
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iOS-test-results
          path: ${{ runner.temp }}/xcode-results/*.xcresult
          if-no-files-found: warn
          retention-days: 7
