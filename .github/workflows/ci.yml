name: CI
run-name: >-
  CI / ${{ (inputs.test_filter || inputs.design_survey_only) && 'focused' || inputs.complete_diagnostics && 'diagnostics' || 'full' }}
  · ${{ github.ref_name }}${{ inputs.test_filter && format(' · {0}', inputs.test_filter) || inputs.design_survey_only && ' · design survey' || '' }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      export_ui_snapshots:
        description: Export screenshot attachments (does not reduce test coverage)
        required: false
        default: false
        type: boolean
      test_filter:
        description: Focused diagnosis only; Target[/Class[/testMethod]] cannot satisfy full CI
        required: false
        default: ""
        type: string
      design_survey_only:
        description: Capture the design survey instead of running the full test suites
        required: false
        default: false
        type: boolean
      complete_diagnostics:
        description: Continue remaining partitions after a smoke assertion fails; not a release gate
        required: false
        default: false
        type: boolean
      use_build_cache:
        description: Reuse exact-input Swift build cache (disable for cold comparisons)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (inputs.test_filter || inputs.design_survey_only) && 'focused' || inputs.complete_diagnostics && 'diagnostics' || 'full' }}
  cancel-in-progress: true

env:
  CI_MODE: ${{ (inputs.test_filter || inputs.design_survey_only) && 'focused' || inputs.complete_diagnostics && 'diagnostics' || 'full' }}
  CI_FILTER: ${{ inputs.test_filter || (inputs.design_survey_only && 'OTodoUITests/OTodoDesignScreenshots') || '' }}
  CI_USE_BUILD_CACHE: ${{ github.event_name == 'pull_request' || inputs.use_build_cache }}
  GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}

jobs:
  preflight:
    name: CI / preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      filter: ${{ steps.mode.outputs.filter }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Set up portable validation tools
        uses: ./.github/actions/setup-build-tools
      - name: Resolve verification mode
        id: mode
        env:
          COMPLETE_DIAGNOSTICS: ${{ inputs.complete_diagnostics }}
        run: |
          set -euo pipefail
          args=()
          if [ "$COMPLETE_DIAGNOSTICS" = true ]; then args+=(--diagnostics); fi
          python3 .github/scripts/ios_ci.py configure --filter "$CI_FILTER" "${args[@]}"
      - name: Validate all source bundle metadata
        run: python3 .github/scripts/validate_bundles.py source
      - name: Verify CI safety and changelog contracts
        run: |
          python3 .github/scripts/ci_runtime.py run --stage portable-ci-contracts --timeout 120 -- \
            python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Summarize preflight
        if: always()
        run: python3 .github/scripts/ci_runtime.py summary --title 'Portable preflight'
      - name: Retain preflight timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics
          if-no-files-found: warn
          retention-days: 7

  swift-package-tests:
    name: Swift package tests
    needs: preflight
    if: needs.preflight.outputs.mode != 'focused'
    runs-on: ubuntu-24.04
    container: swift:6.1.3@sha256:98ee3a8469ce2a9c2f543ef2577939ab44e2dfc9b5ed710732a59e5dd64f9c4a
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Initialize command evidence paths
        run: echo "CI_RESULTS_DIR=$RUNNER_TEMP/ci-metrics" >> "$GITHUB_ENV"
      - name: Set up portable command runner
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Identify compiler and exact cache inputs
        id: toolchain
        env:
          SOURCE_KEY: ${{ hashFiles('Package.*', 'Sources/**', 'Tests/**') }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import platform
          import sys
          sys.path.insert(0, '.github/scripts')
          from ci_runtime import run_command
          identity = run_command(['swift', '--version'], stage='swift-toolchain', timeout=60, capture=True)
          print(identity)
          compiler = hashlib.sha256((identity + platform.machine() + 'sha256:98ee3a8469ce2a9c2f543ef2577939ab44e2dfc9b5ed710732a59e5dd64f9c4a').encode()).hexdigest()[:20]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"key=swift-build-v1-{compiler}-{os.environ['SOURCE_KEY']}\n")
          PY
      - name: Restore exact-input Swift build cache
        if: env.CI_USE_BUILD_CACHE == 'true'
        id: swift-cache
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.toolchain.outputs.key }}
      - name: Run all core tests
        run: |
          python3 .github/scripts/ci_runtime.py run --stage swift-core-tests --timeout 600 \
            --log "$RUNNER_TEMP/ci-metrics/swift-core.log" -- swift test
      - name: Save measured exact-input Swift build cache
        if: success() && env.CI_USE_BUILD_CACHE == 'true' && steps.swift-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.toolchain.outputs.key }}
      - name: Summarize core verification
        if: always()
        run: python3 .github/scripts/ci_runtime.py summary --title 'Complete Linux core suite'
      - name: Retain core timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics
          if-no-files-found: warn
          retention-days: 7

  ios-build:
    name: ${{ needs.preflight.outputs.mode == 'full' && 'iOS / build and smoke' || format('iOS / {0} diagnosis', needs.preflight.outputs.mode) }}
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI_MODE: ${{ needs.preflight.outputs.mode }}
      CI_FILTER: ${{ needs.preflight.outputs.filter }}
    outputs:
      build_ready: ${{ steps.products.outcome == 'success' }}
      products_artifact: ${{ steps.build.outputs.products_artifact }}
    steps:
      - name: Checkout complete build history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Set up verified Apple build tools
        uses: ./.github/actions/setup-build-tools
        with:
          apple: 'true'
      - name: Generate Xcode project
        run: python3 .github/scripts/ci_runtime.py run --stage xcode-project --timeout 60 -- xcodegen generate --spec project.yml
      - name: Build, verify entitlements, and enumerate compiled tests
        id: build
        run: |
          python3 .github/scripts/ios_ci.py build \
            --output "$RUNNER_TEMP/ios-ci" --derived-data "$RUNNER_TEMP/DerivedData"
      - name: Publish exact-run executable test products
        id: products
        if: needs.preflight.outputs.mode != 'focused'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.products_artifact }}
          path: |
            ${{ runner.temp }}/ios-ci/ios-test-products.tar.gz
            ${{ runner.temp }}/ios-ci/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Run early hosted and critical UI gate
        id: smoke
        run: |
          python3 .github/scripts/ios_ci.py test --group smoke \
            --output "$RUNNER_TEMP/ios-ci" --products "$RUNNER_TEMP/DerivedData/Build/Products"
      - name: Collect bounded iOS diagnostics
        if: always()
        env:
          EXPORT_SNAPSHOTS: ${{ inputs.export_ui_snapshots || steps.smoke.outcome != 'success' }}
        run: |
          args=()
          if [ "$EXPORT_SNAPSHOTS" = true ]; then args+=(--export-snapshots); fi
          python3 .github/scripts/ios_ci.py diagnostics --output "$RUNNER_TEMP/ios-ci" "${args[@]}"
      - name: Summarize smoke and build timing
        if: always()
        run: python3 .github/scripts/ci_runtime.py summary --title 'iOS build and early behavioral gate'
      - name: Retain compiled plan and smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-evidence-smoke-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-metrics
            ${{ runner.temp }}/ios-ci/*.json
            ${{ runner.temp }}/ios-ci/logs
          if-no-files-found: warn
          retention-days: 7
      - name: Retain smoke screenshots
        if: always() && (inputs.export_ui_snapshots || !success())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-snapshots-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-ci/snapshots
          if-no-files-found: warn
          retention-days: 7
      - name: Retain failed smoke result bundles
        if: always() && !success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iOS-test-results-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-ci/results
          if-no-files-found: warn
          retention-days: 7

  ios-tests:
    name: ${{ needs.preflight.outputs.mode == 'full' && format('iOS / {0}', matrix.partition) || format('iOS / {0} ({1})', matrix.partition, needs.preflight.outputs.mode) }}
    needs: [preflight, ios-build]
    if: >-
      ${{ !cancelled() && needs.preflight.outputs.mode != 'focused' &&
          needs.ios-build.outputs.build_ready == 'true' &&
          (needs.ios-build.result == 'success' || needs.preflight.outputs.mode == 'diagnostics') }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: ${{ needs.preflight.outputs.mode == 'full' }}
      matrix:
        partition: [functional, integration]
    env:
      CI_MODE: ${{ needs.preflight.outputs.mode }}
      CI_FILTER: ${{ needs.preflight.outputs.filter }}
    steps:
      - name: Checkout orchestration at the exact SHA
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up matching Apple tools
        uses: ./.github/actions/setup-build-tools
        with:
          apple: 'true'
      - name: Download this run's compiled test products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.ios-build.outputs.products_artifact }}
          path: ${{ runner.temp }}/ios-download
      - name: Verify products and prepare isolated simulator
        run: |
          python3 .github/scripts/ios_ci.py restore \
            --download "$RUNNER_TEMP/ios-download" --output "$RUNNER_TEMP/ios-ci"
      - name: Run all tests assigned to this partition without rebuilding
        id: partition
        env:
          PARTITION: ${{ matrix.partition }}
        run: python3 .github/scripts/ios_ci.py test --group "$PARTITION" --output "$RUNNER_TEMP/ios-ci"
      - name: Collect bounded partition diagnostics
        if: always()
        env:
          EXPORT_SNAPSHOTS: ${{ inputs.export_ui_snapshots || steps.partition.outcome != 'success' }}
        run: |
          args=()
          if [ "$EXPORT_SNAPSHOTS" = true ]; then args+=(--export-snapshots); fi
          python3 .github/scripts/ios_ci.py diagnostics --output "$RUNNER_TEMP/ios-ci" "${args[@]}"
      - name: Summarize partition timing and issues
        if: always()
        run: python3 .github/scripts/ci_runtime.py summary --title 'Isolated iOS test partition'
      - name: Retain partition coverage and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-evidence-${{ matrix.partition }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-metrics
            ${{ runner.temp }}/ios-ci/*.json
            ${{ runner.temp }}/ios-ci/logs
          if-no-files-found: warn
          retention-days: 7
      - name: Retain partition screenshots
        if: always() && (inputs.export_ui_snapshots || !success())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-snapshots-${{ matrix.partition }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-ci/snapshots
          if-no-files-found: warn
          retention-days: 7
      - name: Retain failed partition result bundles
        if: always() && !success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iOS-test-results-${{ matrix.partition }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-ci/results
          if-no-files-found: warn
          retention-days: 7

  watchos-simulator:
    name: Apple Watch companion
    needs: preflight
    if: needs.preflight.outputs.mode != 'focused'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PROJECT: OTodo.xcodeproj
    steps:
      - name: Checkout complete build history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Set up verified Apple build tools
        uses: ./.github/actions/setup-build-tools
        with:
          apple: 'true'
      - name: Generate Xcode project
        run: python3 .github/scripts/ci_runtime.py run --stage watch-project --timeout 60 -- xcodegen generate --spec project.yml
      - name: Select and pair compatible preinstalled simulators
        run: python3 .github/scripts/watch_smoke.py prepare --output "$RUNNER_TEMP/watch-smoke"
      - name: Verify simulator boots before building full companion graph
        run: |
          python3 .github/scripts/watch_smoke.py build \
            --output "$RUNNER_TEMP/watch-smoke" --derived-data "$RUNNER_TEMP/WatchDerivedData"
      - name: Verify effective companion bundle entitlements
        run: |
          python3 .github/scripts/validate_bundles.py built --platform simulator \
            --app "$RUNNER_TEMP/WatchDerivedData/Build/Products/Debug-iphonesimulator/OTodo.app"
      - name: Verify real live delivery and offline Watch relaunch
        run: |
          python3 .github/scripts/watch_smoke.py verify \
            --output "$RUNNER_TEMP/watch-smoke" --derived-data "$RUNNER_TEMP/WatchDerivedData"
      - name: Collect bounded Watch diagnostics
        if: always()
        run: python3 .github/scripts/watch_smoke.py diagnostics --output "$RUNNER_TEMP/watch-smoke"
      - name: Summarize Watch timing and issues
        if: always()
        run: python3 .github/scripts/ci_runtime.py summary --title 'Real Watch delivery and offline persistence'
      - name: Retain Watch verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-smoke-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/watch-smoke
            ${{ runner.temp }}/ci-metrics
          if-no-files-found: warn
          retention-days: 7

  full-verification:
    name: CI / full verification
    needs: [preflight, swift-package-tests, ios-build, ios-tests, watchos-simulator]
    if: always() && needs.preflight.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_MODE: full
      CI_FILTER: ${{ needs.preflight.outputs.filter }}
      NEEDS_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Checkout coverage verifier
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Download all attempt-specific coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ios-evidence-*
          path: ${{ runner.temp }}/ios-coverage
      - name: Require all platforms and every compiled iOS test
        run: python3 .github/scripts/ios_ci.py verify --evidence "$RUNNER_TEMP/ios-coverage"
