# All signing and cleanup jobs share the workflow-global queue. Cleanup retries
# consume an immutable certificate-ID allowlist and never repeat an accepted upload.
name: Release IPA

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version override, e.g. 1.2.0 (blank = project value)"
        required: false
        type: string
      publish_testflight:
        description: "Upload the exported IPA to TestFlight"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Archive, sign, and export
    runs-on: macos-latest
    timeout-minutes: 55
    env:
      SCHEME: OTodo
      PROJECT: OTodo.xcodeproj
      CI_MODE: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      ci_url: ${{ steps.verification.outputs.ci_url }}
      ipa_created: ${{ steps.export.outputs.ipa_created }}
      upload_attempted: ${{ steps.testflight.outputs.attempted }}
      upload_accepted: ${{ steps.testflight.outputs.accepted }}
      upload_failed: ${{ steps.testflight.outputs.failed }}
      signing_prepared: ${{ steps.signing_snapshot.outcome == 'success' }}
      cleanup_plan_ready: ${{ steps.cleanup_artifact.outcome == 'success' }}
      cleanup_artifact_name: release-signing-cleanup-${{ github.run_attempt }}
      fallback_cleanup: ${{ steps.fallback_cleanup.outcome }}

    steps:
      - name: Initialize private release paths
        run: |
          {
            echo "ARCHIVE_PATH=$RUNNER_TEMP/OTodo.xcarchive"
            echo "EXPORT_DIR=$RUNNER_TEMP/export"
            echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "CERTIFICATE_SNAPSHOT=$RUNNER_TEMP/signing-certificates-before.json"
            echo "CERTIFICATE_CLEANUP_PLAN=$RUNNER_TEMP/signing-cleanup/allowlist.json"
            echo "RELEASE_LOG_DIR=$RUNNER_TEMP/release-logs"
            echo "CI_RESULTS_DIR=$RUNNER_TEMP/release-metrics"
          } >> "$GITHUB_ENV"

      - name: Verify release prerequisites
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          GITHUB_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
        run: |
          set -u
          missing=0
          if [ -z "${KEY_ID:-}" ]; then
            echo "::error::Missing required secret: APP_STORE_CONNECT_API_KEY_ID"
            missing=1
          fi
          if [ -z "${ISSUER_ID:-}" ]; then
            echo "::error::Missing required secret: APP_STORE_CONNECT_API_ISSUER_ID"
            missing=1
          fi
          if [ -z "${API_KEY:-}" ]; then
            echo "::error::Missing required secret: APP_STORE_CONNECT_API_KEY"
            missing=1
          fi
          if [ -z "${GITHUB_CLIENT_ID:-}" ]; then
            echo "::error::Missing required Actions variable: GH_OAUTH_CLIENT_ID"
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - name: Checkout exact release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned build tools in an isolated environment
        id: tooling
        uses: ./.github/actions/setup-build-tools
        with:
          apple: 'true'

      - name: Prepare release diagnostic paths
        run: mkdir -p "$RELEASE_LOG_DIR" "$CI_RESULTS_DIR" "$(dirname "$CERTIFICATE_CLEANUP_PLAN")"

      - name: Resolve and validate source version before signing
        id: version
        env:
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: python3 .github/scripts/ci_runtime.py run --stage release-source-preflight --timeout 60 -- python3 .github/scripts/release.py version

      - name: Require successful full CI for exact SHA
        id: verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_runtime.py run --stage release-ci-verification --timeout 180 -- python3 .github/scripts/release.py verify-ci

      - name: Validate and install App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: python3 .github/scripts/ci_runtime.py run --stage release-key-installation --timeout 30 -- python3 .github/scripts/release.py install-key

      - name: Read-only Apple registration and capability preflight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          PUBLISH_TESTFLIGHT: ${{ github.event_name == 'push' || inputs.publish_testflight }}
        run: python3 .github/scripts/ci_runtime.py run --stage release-apple-preflight --timeout 240 -- python3 .github/scripts/manage_api_certificates.py preflight

      - name: Generate and validate Xcode project metadata
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_runtime.py run --stage release-project-generation --timeout 90 -- xcodegen generate --spec project.yml
          python3 .github/scripts/validate_bundles.py source

      - name: Prepare ephemeral signing certificate snapshot
        id: signing_snapshot
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BOOTSTRAP_CERTIFICATE_SHA1: 9FA921CB63E1777BBD9C9DA26F7D40315EECE498
        run: python3 .github/scripts/ci_runtime.py run --stage release-signing-snapshot --timeout 180 -- python3 .github/scripts/manage_api_certificates.py prepare

      - name: Archive with cloud signing and validate effective bundle entitlements
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          GITHUB_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
        run: python3 .github/scripts/ci_runtime.py run --stage release-archive-validation --timeout 1560 -- python3 .github/scripts/release.py archive

      - name: Export App Store IPA
        id: export
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: python3 .github/scripts/release.py export

      - name: Capture immutable certificate cleanup allowlist
        id: capture_cleanup
        if: ${{ always() && steps.signing_snapshot.outcome == 'success' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: python3 .github/scripts/ci_runtime.py run --stage release-cleanup-capture --timeout 180 -- python3 .github/scripts/manage_api_certificates.py capture

      - name: Retain certificate IDs for independent cleanup retries
        id: cleanup_artifact
        if: ${{ always() && steps.capture_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signing-cleanup-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signing-cleanup/allowlist.json
          if-no-files-found: error
          retention-days: 30

      - name: Clean up locally if allowlist transport failed
        id: fallback_cleanup
        if: ${{ always() && steps.capture_cleanup.outcome == 'success' && steps.cleanup_artifact.outcome != 'success' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: python3 .github/scripts/ci_runtime.py run --stage release-cleanup-transport-fallback --timeout 180 -- python3 .github/scripts/manage_api_certificates.py cleanup

      - name: Upload IPA artifact
        if: ${{ always() && steps.export.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otodo-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload to TestFlight synchronously
        id: testflight
        if: ${{ success() && (github.event_name == 'push' || inputs.publish_testflight) }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: python3 .github/scripts/release.py upload

      - name: Remove private signing key
        if: ${{ always() }}
        run: rm -f "$API_KEY_PATH"

      - name: Sanitize diagnostic files before artifact transport
        id: sanitize
        if: ${{ always() && steps.tooling.outcome == 'success' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: python3 .github/scripts/release.py sanitize-diagnostics

      - name: Summarize release command timings
        if: ${{ always() && steps.version.outcome != 'skipped' }}
        run: python3 .github/scripts/ci_runtime.py summary --title "Release command timings"

      - name: Retain release diagnostics without signing material
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-logs/*.log
            ${{ runner.temp }}/release-metrics/*.json
          if-no-files-found: ignore
          retention-days: 14

  cleanup:
    name: Revoke only this release's ephemeral certificates
    needs: release
    if: ${{ always() && needs.release.outputs.cleanup_plan_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_MODE: release-cleanup
    steps:
      - name: Initialize private cleanup paths
        run: |
          {
            echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "CERTIFICATE_CLEANUP_PLAN=$RUNNER_TEMP/signing-cleanup/allowlist.json"
            echo "CI_RESULTS_DIR=$RUNNER_TEMP/cleanup-metrics"
          } >> "$GITHUB_ENV"

      - name: Checkout exact release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up isolated cleanup tools
        uses: ./.github/actions/setup-build-tools

      - name: Download immutable cleanup allowlist from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release.outputs.cleanup_artifact_name }}
          path: ${{ runner.temp }}/signing-cleanup

      - name: Install temporary API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: python3 .github/scripts/release.py install-key

      - name: Revoke allowlisted certificates (idempotent)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: python3 .github/scripts/ci_runtime.py run --stage release-certificate-cleanup --timeout 180 -- python3 .github/scripts/manage_api_certificates.py cleanup

      - name: Remove private signing key
        if: ${{ always() }}
        run: rm -f "$API_KEY_PATH"

      - name: Summarize cleanup timing
        if: ${{ always() }}
        run: python3 .github/scripts/ci_runtime.py summary --title "Release cleanup timings"

  summary:
    name: Release outcome
    needs: [release, cleanup]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report publishing and cleanup independently
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          VERSION: ${{ needs.release.outputs.version }}
          BUILD: ${{ needs.release.outputs.build }}
          VERIFIED_CI: ${{ needs.release.outputs.ci_url }}
          IPA_CREATED: ${{ needs.release.outputs.ipa_created }}
          REQUESTED: ${{ github.event_name == 'push' || inputs.publish_testflight }}
          ATTEMPTED: ${{ needs.release.outputs.upload_attempted }}
          ACCEPTED: ${{ needs.release.outputs.upload_accepted }}
          UPLOAD_FAILED: ${{ needs.release.outputs.upload_failed }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          SIGNING_PREPARED: ${{ needs.release.outputs.signing_prepared }}
          FALLBACK_CLEANUP: ${{ needs.release.outputs.fallback_cleanup }}
        run: |
          {
            echo "## OTodo release"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: \`${VERSION:-unresolved}\`; build: \`${BUILD:-unassigned}\`"
            echo "- Full exact-SHA CI: ${VERIFIED_CI:-not verified}"
            echo "- Archive/export job: $RELEASE_RESULT"
            echo "- IPA created: ${IPA_CREATED:-false}"
            echo "- TestFlight requested: $REQUESTED; attempted: ${ATTEMPTED:-false}; accepted: ${ACCEPTED:-false}; failed: ${UPLOAD_FAILED:-false}"
            if [ "$ACCEPTED" = true ]; then
              echo "- TestFlight: upload accepted synchronously; App Store Connect processing is pending."
            elif [ "$UPLOAD_FAILED" = true ]; then
              echo "- TestFlight: upload failed or acceptance was not confirmed; inspect the original altool error."
            elif [ "$REQUESTED" = true ]; then
              echo "- TestFlight: requested but not attempted; an earlier prerequisite or release phase failed."
            else
              echo "- TestFlight: not requested (artifact-only release)."
            fi
            if [ "$CLEANUP_RESULT" = success ] || [ "$FALLBACK_CLEANUP" = success ]; then
              echo "- Certificate cleanup: succeeded."
            elif [ "$CLEANUP_RESULT" = failure ] || [ "$CLEANUP_RESULT" = cancelled ]; then
              echo "- Certificate cleanup: $CLEANUP_RESULT. Rerun failed jobs to retry only immutable-allowlist cleanup, not upload."
            elif [ "$SIGNING_PREPARED" = true ]; then
              echo "- Certificate cleanup: no transported cleanup plan; inspect capture/transport failure. Never infer a new allowlist from a later team-wide snapshot."
            else
              echo "- Certificate cleanup: not required; signing preparation did not complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
