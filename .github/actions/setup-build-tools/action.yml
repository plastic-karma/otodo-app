name: Set up CI build tools
description: Install isolated Python dependencies and optional verified Apple build tools
inputs:
  apple:
    description: Select Xcode and install XcodeGen on a macOS runner
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install isolated CI Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        export CI_RESULTS_DIR="${CI_RESULTS_DIR:-$RUNNER_TEMP/ci-metrics}"
        echo "CI_RESULTS_DIR=$CI_RESULTS_DIR" >> "$GITHUB_ENV"
        venv="$RUNNER_TEMP/ci-python"
        python3 .github/scripts/ci_runtime.py run --stage python-environment --timeout 120 -- \
          python3 -m venv "$venv"
        python3 .github/scripts/ci_runtime.py run --stage python-dependencies --timeout 120 -- \
          "$venv/bin/python3" -m pip install --disable-pip-version-check \
          --requirement .github/scripts/requirements.txt
        echo "$venv/bin" >> "$GITHUB_PATH"

    - name: Select newest installed Xcode
      if: inputs.apple == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 <<'PY'
        import hashlib
        import os
        from pathlib import Path
        import plistlib
        import sys

        sys.path.insert(0, ".github/scripts")
        from ci_runtime import annotate, run_command

        choices = []
        for app in Path("/Applications").glob("Xcode*.app"):
            try:
                with (app / "Contents/Info.plist").open("rb") as source:
                    version = plistlib.load(source)["CFBundleShortVersionString"]
                choices.append((tuple(int(part) for part in version.split(".")), str(app)))
            except (KeyError, OSError, TypeError, ValueError):
                continue
        if not choices:
            annotate("error", "No installed Xcode was found; use a runner with the required Apple SDKs.")
            raise SystemExit(1)
        developer = max(choices)[1] + "/Contents/Developer"
        run_command(["sudo", "xcode-select", "--switch", developer], stage="select-xcode", timeout=60)
        identity = run_command(["xcodebuild", "-version"], stage="xcode-identity", timeout=60, capture=True)
        print(identity, flush=True)
        with open(os.environ["GITHUB_ENV"], "a") as output:
            output.write(f"CI_XCODE_ID={hashlib.sha256(identity.encode()).hexdigest()[:16]}\n")
        PY

    - name: Install checksum-verified XcodeGen 2.46.0
      if: inputs.apple == 'true'
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/xcodegen.zip"
        install_dir="$RUNNER_TEMP/xcodegen-tool"
        python3 .github/scripts/ci_runtime.py run --stage xcodegen-download --timeout 90 -- \
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 60 --retry 2 \
          --output "$archive" \
          https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
        if ! echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $archive" | shasum -a 256 --check; then
          echo "::error::XcodeGen 2.46.0 archive failed its pinned SHA-256 check."
          exit 1
        fi
        mkdir -p "$install_dir"
        python3 .github/scripts/ci_runtime.py run --stage xcodegen-install --timeout 30 -- \
          unzip -q "$archive" -d "$install_dir"
        tool="$install_dir/xcodegen/bin/xcodegen"
        chmod +x "$tool"
        echo "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"
        echo "XCODEGEN=$tool" >> "$GITHUB_ENV"
        "$tool" --version
