name: OTodo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  OTodoCore:
    path: .

targets:
  OTodo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OTodoApp
    dependencies:
      - package: OTodoCore
        product: OTodoCore
    info:
      path: OTodoApp/Info.plist
      properties:
        CFBundleDisplayName: OTodo
        ITSAppUsesNonExemptEncryption: false
        GitHubClientID: "$(GITHUB_CLIENT_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo
        PRODUCT_NAME: OTodo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GITHUB_CLIENT_ID: ""
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"

  OTodoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OTodoUITests
    dependencies:
      - target: OTodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo.uitests
        PRODUCT_NAME: OTodoUITests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: OTodo
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"

schemes:
  OTodo:
    build:
      targets:
        OTodo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OTodoUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
