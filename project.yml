name: OTodo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  OTodoCore:
    path: .

targets:
  OTodo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OTodoApp
      - path: OTodoShared
    dependencies:
      - package: OTodoCore
        product: OTodoCore
      - target: OTodoWidget
        embed: true
      - target: OTodoShareExtension
        embed: true
      - target: OTodoWatch
        embed: true
        link: false
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    postBuildScripts:
      - name: Generate bundled changelog
        script: |
          set -eu
          python3 "$SRCROOT/.github/scripts/generate_changelog.py" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Changelog.json"
        inputFiles:
          - $(SRCROOT)/.github/scripts/generate_changelog.py
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Changelog.json
        # HEAD may be symbolic, detached, or in an external worktree Git directory.
        basedOnDependencyAnalysis: false
    info:
      path: OTodoApp/Info.plist
      properties:
        CFBundleDisplayName: OTodo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        GitHubClientID: "$(GITHUB_CLIENT_ID)"
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: plastickarma.otodo.new-todo
            UIApplicationShortcutItemTitle: New Todo
            UIApplicationShortcutItemIconSymbolName: plus.circle.fill
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo
        PRODUCT_NAME: OTodo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: OTodoApp/OTodo.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GITHUB_CLIENT_ID: ""
        # Git reads refs, objects, and worktree metadata beyond fixed script inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  OTodoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OTodoWidget
      - path: OTodoShared
    dependencies:
      - package: OTodoCore
        product: OTodoCore
    info:
      path: OTodoWidget/Info.plist
      properties:
        CFBundleDisplayName: OTodo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo.widget
        PRODUCT_NAME: OTodoWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: OTodoWidget/OTodoWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  OTodoShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OTodoShareExtension
        excludes:
          - ShareSource.js
      - path: OTodoShareExtension/ShareSource.js
        buildPhase: resources
      - path: OTodoShared
      - path: OTodoApp/OTodoTheme.swift
    dependencies:
      - package: OTodoCore
        product: OTodoCore
    info:
      path: OTodoShareExtension/Info.plist
      properties:
        CFBundleDisplayName: OTodo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: ShareSource
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo.share
        PRODUCT_NAME: OTodoShareExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: OTodoShareExtension/OTodoShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  OTodoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: OTodoWatch
      - path: OTodoShared/SharedWorkspaceStorage.swift
      - path: OTodoShared/WatchSnapshotStorage.swift
    dependencies:
      - package: OTodoCore
        product: OTodoCore
      - sdk: WatchConnectivity.framework
      - target: OTodoWatchWidget
        embed: true
    info:
      path: OTodoWatch/Info.plist
      properties:
        CFBundleDisplayName: OTodo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: plastickarma.otodo
        WKRunsIndependentlyOfCompanionApp: false
        CFBundleURLTypes:
          - CFBundleURLName: plastickarma.otodo.watchkitapp
            CFBundleURLSchemes:
              - otodo-watch
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo.watchkitapp
        PRODUCT_NAME: OTodoWatch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: OTodoWatch/OTodoWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        "CODE_SIGNING_ALLOWED[sdk=watchsimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=watchsimulator*]": "-"

  OTodoWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: OTodoWatchWidget
      - path: OTodoShared/SharedWorkspaceStorage.swift
      - path: OTodoShared/WatchSnapshotStorage.swift
    dependencies:
      - package: OTodoCore
        product: OTodoCore
    info:
      path: OTodoWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: OTodo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo.watchkitapp.widget
        PRODUCT_NAME: OTodoWatchWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: OTodoWatchWidget/OTodoWatchWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        "CODE_SIGNING_ALLOWED[sdk=watchsimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=watchsimulator*]": "-"

  OTodoAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OTodoAppTests
      - path: OTodoShareExtension/ShareCaptureExtractor.swift
    dependencies:
      - target: OTodo
      - package: OTodoCore
        product: OTodoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo.apptests
        PRODUCT_NAME: OTodoAppTests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OTodo.app/OTodo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  OTodoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OTodoUITests
    dependencies:
      - target: OTodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo.uitests
        PRODUCT_NAME: OTodoUITests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: OTodo
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

schemes:
  OTodo:
    build:
      targets:
        OTodo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OTodoAppTests
        - OTodoUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  OTodoWatch:
    build:
      targets:
        OTodoWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
