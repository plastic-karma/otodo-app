name: OTodo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  OTodoCore:
    path: .

targets:
  OTodo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OTodoApp
      - path: OTodoShared
    dependencies:
      - package: OTodoCore
        product: OTodoCore
      - target: OTodoWidget
        embed: true
    info:
      path: OTodoApp/Info.plist
      properties:
        CFBundleDisplayName: OTodo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        GitHubClientID: "$(GITHUB_CLIENT_ID)"
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: plastickarma.otodo.new-todo
            UIApplicationShortcutItemTitle: New Todo
            UIApplicationShortcutItemIconSymbolName: plus.circle.fill
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo
        PRODUCT_NAME: OTodo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: OTodoApp/OTodo.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GITHUB_CLIENT_ID: ""
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"

  OTodoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OTodoWidget
      - path: OTodoShared
    dependencies:
      - package: OTodoCore
        product: OTodoCore
    info:
      path: OTodoWidget/Info.plist
      properties:
        CFBundleDisplayName: OTodo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo.widget
        PRODUCT_NAME: OTodoWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: OTodoWidget/OTodoWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"

  OTodoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OTodoUITests
    dependencies:
      - target: OTodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plastickarma.otodo.uitests
        PRODUCT_NAME: OTodoUITests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: OTodo
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"

schemes:
  OTodo:
    build:
      targets:
        OTodo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OTodoUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
